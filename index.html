<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='4' fill='%232c3fbf'/%3E%3Crect x='3' y='5' width='26' height='7' rx='3' fill='%23161a20'/%3E%3Crect x='8' y='16' width='5' height='4' rx='1' fill='%23fff'/%3E%3Crect x='15' y='16' width='5' height='4' rx='1' fill='%23fff'/%3E%3Crect x='8' y='22' width='5' height='4' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Alivia's Workday Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="board-css">
:root{
  --ground:#eef0ee; --surface:#fbfbf9; --surface-2:#f4f5f2; --ink:#161a20; --ink-2:#4d5360; --muted:#7b808b;
  --line:#dcdfda; --line-2:#c6cac4; --accent:#2c3fbf; --accent-soft:#e4e7fa; --on-accent:#ffffff;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --crit:#d03b3b; --crit-ink:#b02a2a;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --empty:#e3e5e1;
  --display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111315; --surface:#1a1c1f; --surface-2:#222529; --ink:#f1f2ee; --ink-2:#c3c5c0; --muted:#8d9098;
    --line:#2c2f33; --line-2:#3b3f44; --accent:#8b99ff; --accent-soft:#252a4a; --on-accent:#0f1226;
    --good-ink:#3fcf3f; --warn-ink:#fab219; --crit-ink:#f07a7a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --empty:#2a2d31;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111315; --surface:#1a1c1f; --surface-2:#222529; --ink:#f1f2ee; --ink-2:#c3c5c0; --muted:#8d9098;
  --line:#2c2f33; --line-2:#3b3f44; --accent:#8b99ff; --accent-soft:#252a4a; --on-accent:#0f1226;
  --good-ink:#3fcf3f; --warn-ink:#fab219; --crit-ink:#f07a7a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --empty:#2a2d31;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:19px}
h3{font-size:15px;font-family:var(--sans);font-weight:600;letter-spacing:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line-2)}
.top .who{display:flex;flex-direction:column;gap:4px}
.datenav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.datenav input[type=date]{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;width:auto}
.btn{background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 11px;cursor:pointer;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.tabs{display:flex;gap:2px;margin:14px 0 18px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.dot.off{background:var(--warn)}
.banner{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px}

/* layout */
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
@media (max-width:880px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:600}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:last-child{grid-column:1/-1}}

/* timeline strip */
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-bottom:6px}
.strip div{height:26px;border-radius:4px;background:var(--empty);position:relative}
.strip div.planned{opacity:.38}
.striplbl{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;font-size:11px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* hourly log */
.hours{display:flex;flex-direction:column}
.hour{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hour:first-child{border-top:none;padding-top:0}
.hour .t{font-family:var(--mono);font-size:13px;color:var(--ink-2);padding-top:2px}
.hour .t .now{display:inline-block;margin-top:4px;font-size:10.5px;background:var(--accent);color:var(--on-accent);border-radius:3px;padding:0 5px;font-family:var(--sans);font-weight:600}
.plan{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;align-items:flex-start}
.plan .sw{margin-top:4px}
.hrow{display:flex;gap:8px;align-items:flex-start}
.hrow select{flex:none;max-width:44%}
textarea,input[type=text],input[type=number],input[type=date],input[type=time],select{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:36px;line-height:1.4}
select{width:auto;cursor:pointer}
input:disabled,textarea:disabled,select:disabled{opacity:.75;cursor:default}

/* checklist */
.checks{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 6px;border-radius:6px;cursor:pointer}
.chk:hover{background:var(--surface-2)}
.chk input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.chk .lbl{flex:1;min-width:0}
.chk.done .lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.chk .tag{font-size:11px;color:var(--muted)}
.group-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:12px 0 4px 6px}
.group-h:first-child{margin-top:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:999px;padding:1px 8px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.good{border-color:var(--good);color:var(--good-ink)}
.pill.warn{border-color:var(--warn);color:var(--warn-ink)}
.pill.crit{border-color:var(--crit);color:var(--crit-ink)}
.pill.acc{border-color:var(--accent);color:var(--accent)}

/* tables & rows */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.today td{background:var(--accent-soft)}
.rowform{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-top:10px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.entry:first-child{border-top:none}
.entry .meta{font-size:12px;color:var(--muted)}
.x{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:16px;line-height:1}
.x:hover{color:var(--crit-ink);background:var(--surface-2)}

/* week */
.rhythm{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;min-width:860px}
.rday{display:flex;flex-direction:column;gap:6px}
.rday .dh{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px;border-bottom:2px solid var(--line-2)}
.rday.cur .dh{border-bottom-color:var(--accent)}
.rblock{border-left:3px solid var(--line-2);background:var(--surface-2);border-radius:0 6px 6px 0;padding:6px 8px;font-size:12px;line-height:1.35}
.rblock .tm{font-family:var(--mono);font-size:11px;color:var(--muted)}
.deadline{display:flex;gap:6px;align-items:flex-start;font-size:12px;font-weight:500}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;white-space:nowrap;z-index:5;transform:translate(-50%,-110%)}
.pipeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.pipeline{grid-template-columns:1fr 1fr}}
.stage{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.stage.done{border-color:var(--good)}
.stage .when{font-size:11.5px;color:var(--muted)}
.counter{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:8px;align-items:center;padding:4px 0}

/* personal */
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.meters{grid-template-columns:1fr 1fr}}
.meter{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--empty);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.routine{display:grid;grid-template-columns:48px minmax(0,1fr);gap:6px 10px;align-items:center}
.routine .d{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.routine .d.cur{color:var(--accent);font-weight:600}
.shop-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{background:none;border:none;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* home */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.cards3{grid-template-columns:1fr}}
.mcard{display:flex;flex-direction:column;gap:10px}
.big{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}

/* setup */
.setrow{display:grid;grid-template-columns:auto 70px 70px minmax(160px,1fr) 170px auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);min-width:760px}
.setrow.tasks{grid-template-columns:auto minmax(200px,1fr) 170px 150px auto}
.days7{display:inline-flex;gap:2px}
.days7 label{display:inline-flex}
.days7 input{position:absolute;opacity:0;width:1px;height:1px}
.days7 span{width:22px;height:22px;display:inline-grid;place-items:center;font-size:11px;border-radius:4px;border:1px solid var(--line-2);cursor:pointer;color:var(--muted)}
.days7 input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.days7 input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.note{font-size:12.5px;color:var(--ink-2);max-width:68ch}
.files{display:flex;flex-direction:column}
.file{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.file:first-child{border-top:none}
.file .ico{width:34px;height:40px;border:1px solid var(--line-2);border-radius:4px;display:grid;place-items:end center;font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--good-ink);padding-bottom:4px;background:var(--surface-2)}
.file .nm{font-weight:600;overflow-wrap:anywhere}
.file .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.file.open{background:var(--accent-soft);margin-inline:-16px;padding-inline:16px}
.upl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px;border:1px dashed var(--line-2);border-radius:8px;margin-top:12px}
.upl input[type=file]{font-size:13px;max-width:100%}
.preview{margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.preview .ph{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.preview .ph input{max-width:260px}
.preview .scroll{max-height:420px;overflow:auto}
.preview table{font-size:12.5px}
.preview th{position:sticky;top:0;background:var(--surface);z-index:1}
.preview td{white-space:nowrap}
.preview td.rn{color:var(--muted);font-family:var(--mono);text-align:right}
.subnav{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;margin-bottom:18px}
.subnav button{background:var(--surface);border:none;padding:7px 16px;cursor:pointer;color:var(--ink-2);font-weight:500}
.subnav button+button{border-left:1px solid var(--line-2)}
.subnav button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.ticket{border-top:1px solid var(--line);padding:10px 0}
.ticket:first-child{border-top:none}
.ticket .th{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.ticket .tid{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.ticket .tt{font-weight:600;overflow-wrap:anywhere}
.ticket .tm{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.ticket .tbody{margin-top:10px;display:grid;gap:8px;grid-template-columns:1fr 1fr;padding:12px;background:var(--surface-2);border-radius:8px}
.ticket .tbody .full{grid-column:1/-1}
@media (max-width:600px){.ticket .tbody{grid-template-columns:1fr}}
.ticket label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.ticket label input,.ticket label select,.ticket label textarea{color:var(--ink);font-size:13.5px;background:var(--surface)}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.linkbtn:hover{text-decoration:underline}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:14px;background:var(--empty);border-radius:0 4px 4px 0;position:relative}
.hbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0}
.hbar .fill.over{background:var(--crit)}
.hbar .cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.hbar .amt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
@media (max-width:560px){.hbar{grid-template-columns:1fr 84px}.hbar .track{grid-column:1/-1;grid-row:2}}
.ledger td{vertical-align:middle}
.ledger input[type=text],.ledger input[type=number],.ledger select{background:transparent;border-color:transparent;padding:4px 6px}
.ledger input:hover,.ledger select:hover{border-color:var(--line-2)}
.ledger input:focus,.ledger select:focus{background:var(--surface-2);border-color:var(--line-2)}
.ledger input[type=number]{text-align:right;font-family:var(--mono);width:110px}
.ledger tr.cat td{background:var(--surface-2);font-weight:600;border-bottom:1px solid var(--line-2)}
.ledger tr.est td{color:var(--ink-2)}
.delta{font-family:var(--mono);font-size:12px;white-space:nowrap}
.delta.up{color:var(--crit-ink)} .delta.down{color:var(--good-ink)}
.debt{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.debt:first-child{border-top:none;padding-top:0}
.copybox{margin-top:10px}
.copybox textarea{font-family:var(--mono);font-size:12px;min-height:140px}
.lrow{display:flex;gap:6px;align-items:center;padding:3px 0}
.lrow input[type=text]{flex:1}
.lrow .x:disabled{opacity:.3;cursor:default}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;align-items:start}
.report{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.rp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.rp-head h2{font-size:26px}
.rp-sec h3{font-family:var(--display);font-size:16px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.rp-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.rp-cols{grid-template-columns:1fr}}
.rp-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.rp-list li.no{color:var(--muted)}
.rp-hours td:first-child{font-family:var(--mono);white-space:nowrap;color:var(--ink-2)}
.rp-text{white-space:pre-wrap;margin:0}
.ccall{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:5px}
.ccall:first-of-type{border-top:none;padding-top:0}
.ccall-h{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:baseline}
.ccall-sum{background:var(--surface-2);border-radius:6px;padding:6px 8px;color:var(--ink-2)}
.ccall-f{display:grid;grid-template-columns:1fr 1fr;gap:6px}
details>summary{list-style:revert}

const listeners=[];let channel=null;
function snapDoc(path,data){return{id:path.split("/")[1],exists:data!=null,data:()=>data==null?undefined:data,metadata:{fromCache:false,hasPendingWrites:false}};}
function err(e){return{code:"unavailable",message:(e&&e.message)||"Database error"};}
function ensureChannel(){
  if(channel)return;
  channel=sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},payload=>{
    const row=payload.eventType==="DELETE"?payload.old:payload.new;if(!row||!row.path)return;
    const coll=row.path.split("/")[0];
    listeners.filter(l=>l.coll===coll).forEach(l=>l.apply(payload.eventType,row));
  }).subscribe(status=>{if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")listeners.forEach(l=>l.error&&l.error({code:"unavailable",message:"Live updates paused"}));});
}
function docRef(path){

    async update(body){const cur=await this.get();if(!cur.exists)throw{code:"invalid_argument",message:"Missing document"};return this.set(Object.assign({},cur.data(),body));},
    async delete(){const {error}=await sb.from("docs").delete().eq("path",path);if(error)throw err(error);},
    onSnapshot(next,error){let alive=true;this.get().then(s=>alive&&next(s)).catch(e=>error&&error(e));
      ensureChannel();const l={coll:path.split("/")[0],error,apply:(t,row)=>{if(row.path===path&&alive)next(snapDoc(path,t==="DELETE"?null:row.data));}};listeners.push(l);
      return()=>{alive=false;const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1);};}
  };
}
function query(coll,lim,desc){
  return{
    orderBy(_f,dir){return query(coll,lim,dir==="desc");},
    limit(n){return query(coll,n,desc);},
    doc(id){return docRef(coll+"/"+(id||Math.random().toString(36).slice(2)));},
    async get(){let q=sb.from("docs").select("path,data").eq("collection",coll).order("path",{ascending:!desc});if(lim)q=q.limit(lim);const {data,error}=await q;if(error)throw err(error);
      const docs=(data||[]).map(r=>snapDoc(r.path,r.data));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>docs.map((d,i)=>({type:"added",doc:d,oldIndex:-1,newIndex:i})),metadata:{fromCache:false,hasPendingWrites:false}};},
    onSnapshot(next,error){
      let alive=true;const map=new Map();
      const emit=changes=>{if(!alive)return;const docs=[...map.entries()].sort((a,b)=>desc?b[0].localeCompare(a[0]):a[0].localeCompare(b[0])).map(([p,d])=>snapDoc(p,d));
        next({docs,size:docs.length,empty:!docs.length,docChanges:()=>changes,metadata:{fromCache:false,hasPendingWrites:false}});};
      this.get().then(s=>{s.docs.forEach(d=>map.set(coll+"/"+d.id,d.data()));emit(s.docChanges());}).catch(e=>error&&error(e));
      ensureChannel();
      const l={coll,error,apply:(t,row)=>{const old=map.get(row.path);
        if(t==="DELETE"){map.delete(row.path);emit([{type:"removed",doc:snapDoc(row.path,old||{}),oldIndex:0,newIndex:-1}]);}
        else{map.set(row.path,row.data);emit([{type:old===undefined?"added":"modified",doc:snapDoc(row.path,row.data),oldIndex:-1,newIndex:0}]);}}};
      listeners.push(l);
      return()=>{alive=false;const i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1);};}
  };
}

function setPath(obj,path,val){
  const parts=path.split(".");let o=obj;
  for(let i=0;i<parts.length-1;i++){
    const k=parts[i];
    if(o[k]==null||typeof o[k]!=="object")o[k]=/^\d+$/.test(parts[i+1])&&Array.isArray(o[k])?[]:{};
    o=o[k];
  }
  o[parts[parts.length-1]]=val;
}
function getPath(obj,path){return path.split(".").reduce((o,k)=>o==null?undefined:o[k],obj);}

/* ---------- saving ---------- */
const timers={}, saving={};
function setStatus(t,ok){document.getElementById("stext").textContent=t;document.getElementById("sdot").className="dot"+(ok===false?" off":"");}
function touch(key){
  const p=pathOf(key);
  if(key==="day")cache[p].date=cur;
  if(key==="week")cache[p].monday=mondayOf(cur);
  touchPath(p);
}
function touchPath(p){
  if(p.startsWith("finance/"))cache[p].month=p.slice(8);
  ver[p]=(ver[p]||0)+1;dirty[p]=ver[p];
  clearTimeout(timers[p]);timers[p]=setTimeout(()=>flush(p),650);
  setStatus("Saving…",true);
}
async function flush(p){
  if(saving[p]){timers[p]=setTimeout(()=>flush(p),300);return;}
  saving[p]=true;const v=ver[p];
  const body=JSON.parse(JSON.stringify(cache[p]));
  try{
    if(db){await db.doc(p).set(body);}
    else{try{localStorage.setItem("wb:"+p,JSON.stringify(body));}catch(e){}}
    setStatus(db?"Saved · shared":"Saved on this device only",!!db);
  }catch(e){
    if(e&&e.code==="invalid_argument"&&!canWriteKnown){canWrite=false;render();}
    setStatus("Not saved: "+((e&&e.message)||"try again"),false);
  }
  saving[p]=false;
  if(ver[p]===v)delete dirty[p];
}
let canWriteKnown=false;

/* ---------- plan helpers ---------- */
function blockFor(date,h){
  const w=dow(date);const cfg=doc("config");
  return cfg.blocks.find(b=>b.days.includes(w)&&h>=b.start&&h<b.end)||null;
}
function callInHour(date,h){
  const sd=syncDoc(date);if(!sd||!sd.calls)return null;
  const hs=parse(date);hs.setHours(h,0,0,0);const he=new Date(hs.getTime()+3600000);
  return sd.calls.find(c=>{if(c.status!=="done"&&c.status!=="live")return false;const a=new Date(c.start||c.schedStart),b=c.end?new Date(c.end):new Date(a.getTime()+(c.minutes||30)*60000);
    return Math.min(b,he)-Math.max(a,hs)>=10*60000;})||null;
}
function hourCat(d,date,h){
  const e=(d&&d.hours&&d.hours[h])||{};
  if(e.cat)return{cat:e.cat,logged:true};
  const b=blockFor(date,h);
  if(e.note&&b)return{cat:b.cat,logged:true};
  const ci=callInHour(date,h);if(ci){const cc=CAT.calls?"calls":(b?b.cat:null);if(cc)return{cat:cc,logged:true,auto:ci};}
  return{cat:b?b.cat:null,logged:false};
}
function tasksFor(date){const w=dow(date);return doc("config").tasks.filter(t=>t.days.includes(w));}
function syncDoc(date){return cache["sync/"+date]||null;}
function adminNames(){return (cache["sync/intercom-admins"]||{}).names||{};}
function myAdminId(){const c=doc("config");if(c.intercomMe)return String(c.intercomMe);const n=adminNames();const k=Object.keys(n).find(id=>/alivia/i.test(n[id]));return k||"";}
const fmtT=iso=>iso?new Date(iso).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}):"";
function allCalls(date){
  const d=dayDoc(date)||{};const sd=syncDoc(date);const X=d.callx||{};const out=[];
  ((sd&&sd.calls)||[]).forEach(c=>{const x=X[c.key]||{};
    out.push({src:"zoom",key:c.key,agent:c.agent||c.title,email:c.agentEmail||"",reason:c.reason||"",summary:c.summary||"",rec:c.recordingUrl||"",
      status:c.status||"done",start:c.start||c.schedStart,schedStart:c.schedStart,minutes:c.minutes,
      type:x.type||c.typeGuess||"",outcome:x.outcome||"",impact:x.impact||"",note:x.note||"",time:fmtT(c.start||c.schedStart)});});
  (d.calls||[]).forEach((c,i)=>out.push(Object.assign({src:"manual",idx:i,status:"done"},c)));
  return out;
}
const countsAsCall=c=>c.status==="done"||c.status==="live";
function dayStats(date){
  const d=dayDoc(date)||{};
  const tasks=tasksFor(date);
  const done=tasks.filter(t=>d.checks&&d.checks[t.id]).length;
  let logged=0;const byCat={};
  HOURS.forEach(h=>{const r=hourCat(d,date,h);if(r.logged){logged++;byCat[r.cat]=(byCat[r.cat]||0)+1;}});
  const calls=allCalls(date).filter(countsAsCall);
  const impact=calls.reduce((s,c)=>s+(parseFloat(c.impact)||0),0);
  const resolved=calls.filter(c=>c.outcome==="Resolved").length;
  const sd=syncDoc(date);const ic=sd&&sd.intercom;const me=myAdminId();
  const mine=ic&&me?((ic.byAdmin||[]).find(a=>String(a.id)===me)||{}):{};
  const noShows=allCalls(date).filter(c=>c.status==="no-show"||c.status==="missed").length;
  return{tasks:tasks.length,done,logged,byCat,calls:calls.length,resolved,impact,side:(d.side||[]).length,chats:ic?(mine.handled||0):null,teamChats:ic?ic.handled||0:null,noShows};
}
function nextDeadline(){
  const now=new Date();const out=[];
  const mon=mondayOf(TODAY);const wk=cache["weeks/"+mon]||{};
  const wed=addDays(mon,2);
  if(!(wk.mig&&wk.mig.sent))out.push({when:parse(wed).setHours(18),label:"Migration list to Telgorithm",date:wed,time:"6:00 PM"});
  const disp=(doc("disputes").items||[]).filter(x=>x.status==="open"&&x.due);
  disp.forEach(x=>out.push({when:parse(x.due).setHours(23),label:"Dispute: "+(x.ref||"untitled"),date:x.due,time:""}));
  [1,5].forEach(w=>{let d=TODAY;for(let i=0;i<7;i++){if(dow(d)===w)break;d=addDays(d,1);}out.push({when:parse(d).setHours(17),label:"10DLC brands, campaigns, appeals",date:d,time:""});});
  return out.filter(x=>x.when>=now.getTime()-3600000).sort((a,b)=>a.when-b.when)[0]||null;
}

function parseCSV(t){
  t=t.replace(/^﻿/,"");const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.length>1||row[0]!=="")rows.push(row);row=[];}
    else f+=c;}
  row.push(f);if(row.length>1||row[0]!=="")rows.push(row);
  return rows;
}
const fsize=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
function loadPreview(id){
  if(previews[id])return;previews[id]="loading";
  (window.__blobFetch?window.__blobFetch(id):fetch("/_blob/"+id)).then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})
    .then(t=>{previews[id]={text:t,rows:parseCSV(t)};scheduleRender();})
    .catch(()=>{previews[id]={error:true};scheduleRender();});
}

}
function rWeek(){

  // rhythm

    const bl=cfg.blocks.filter(b=>b.days.includes(w)).sort((a,b)=>a.start-b.start);
    const dl=[];if(w===3)dl.push("Migration list → Telgorithm, 6 PM");if(w===1||w===5)dl.push("10DLC: brands, campaigns, appeals");if(w===5)dl.push("Submit disputes due");if(w===1)dl.push("Get migration list");
    if(w===6)dl.push("Shopping trip + meal prep");

    <tr><td><strong>Week</strong></td><td class="num"><strong>${tot.tasks?Math.round(tot.done/tot.tasks*100)+"%":"–"}</strong></td><td class="num"><strong>${tot.logged}</strong></td><td class="num"><strong>${tot.calls}</strong></td><td class="num"><strong>${stats.reduce((a,x)=>a+(x.chats||0),0)}</strong></td><td class="num"><strong>${tot.resolved}</strong></td><td class="num"><strong>${money(tot.impact)}</strong></td><td class="num"><strong>${tot.side}</strong></td></tr></tbody></table></div>`;
  // call mix

  const mixH=Object.keys(mix).length?`<table><thead><tr><th>Call type</th><th class="num">Calls</th><th class="num">$ won / saved</th></tr></thead><tbody>${Object.entries(mix).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.n}</td><td class="num">${money(v.imp)}</td></tr>`).join("")}</tbody></table>`:`<p class="muted small">Calls logged on the Today tab roll up here by type, so you can see which kinds of calls bring in or save revenue.</p>`;
  // migration pipeline
  const m=wk.mig||{};

  const pipe=`<div class="pipeline">${stages.map(([k,l,when])=>`<label class="stage${m[k]?" done":""}"><span class="when">${when}</span><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-k="week" data-p="mig.${k}"${m[k]?" checked":""}${dis()}><strong>${l}</strong></span></label>`).join("")}</div>
    <div class="rowform"><label class="small">Agents on list<input type="number" min="0" data-k="week" data-p="mig.count" value="${esc(m.count)}"${dis()}></label><label class="small">Cleared to migrate<input type="number" min="0" data-k="week" data-p="mig.cleared" value="${esc(m.cleared)}"${dis()}></label><label class="small">Flagged for content<input type="number" min="0" data-k="week" data-p="mig.flagged" value="${esc(m.flagged)}"${dis()}></label></div>`;
  // 10DLC
  const dlc=(which,lbl)=>{const o=(wk.dlc&&wk.dlc[which])||{};return `<div><h3 style="margin-bottom:6px">${lbl}</h3>${[["brands","Brands re-submitted"],["campaigns","Campaigns submitted"],["appeals","Campaigns appealed"]].map(([k,l])=>`<label class="counter small"><span>${l}</span><input type="number" min="0" data-k="week" data-p="dlc.${which}.${k}" value="${esc(o[k])}"${dis()}></label>`).join("")}</div>`;};
  // disputes

    else if(x.status!=="open")pill=`<span class="pill good">✓ ${esc(x.status)}</span>`;
    return `<tr><td>${esc(x.ref)}</td><td class="num">${x.amount?money(x.amount):""}</td><td class="mono small">${x.due?fmtShort(x.due):""}</td><td>${pill}</td><td><select data-k="disputes" data-p="items.${i}.status" aria-label="Status"${dis()}>${["open","submitted","won","lost"].map(s=>`<option${s===x.status?" selected":""}>${s}</option>`).join("")}</select></td><td>${canWrite?`<button class="x" data-act="deldisp" data-i="${i}" aria-label="Remove dispute">×</button>`:""}</td></tr>`;}).join("");
  const openAmt=dsp.filter(x=>x.status==="open").reduce((s,x)=>s+(parseFloat(x.amount)||0),0);
  return `<div class="panel" style="margin-bottom:20px"><div class="panel-h"><div><span class="eyebrow">Week of ${fmtShort(mon)}</span><h2>How a week is built</h2></div><span class="small muted">Deadlines marked with !</span></div>${rh}</div>
  <div class="grid2" style="margin-bottom:20px">
    <section class="panel"><div class="panel-h"><div><span class="eyebrow">From the hourly log</span><h2>Hours by category</h2></div></div><div class="chart" id="chart"></div>${legend()}</section>
    <section class="panel"><div class="panel-h"><h2>Call mix this week</h2></div><div class="tbl-wrap">${mixH}</div></section>
  </div>
  <section class="panel" style="margin-bottom:20px"><div class="panel-h"><h2>Week totals</h2><span class="small muted">${tot.calls} calls · ${money(tot.impact)} won or saved</span></div>${tbl}</section>

  <section class="panel" style="margin-top:20px"><div class="panel-h"><div><span class="eyebrow">Goal: most sent in every Friday</span><h2>Disputes</h2></div><span class="small muted mono">${dsp.filter(x=>x.status==="open").length} open · ${money(openAmt)}</span></div>
    ${dsp.length?`<div class="tbl-wrap"><table><thead><tr><th>Dispute</th><th class="num">Amount</th><th>Due</th><th>State</th><th>Status</th><th></th></tr></thead><tbody>${dRows}</tbody></table></div>`:`<p class="muted small">No disputes tracked yet. Add them as you find them in Stripe, with their submission deadline.</p>`}
    ${canWrite?`<div class="rowform"><input type="text" id="d-ref" placeholder="Customer or Stripe ID"><input type="number" id="d-amt" placeholder="Amount" min="0" step="0.01"><input type="date" id="d-due" aria-label="Submission deadline"><button class="btn primary" data-act="adddisp">Add dispute</button></div>`:""}</section>`;
}

function wireChart(){
  const el=document.getElementById("chart");if(!el)return;
  const mon=mondayOf(cur);const days=[0,1,2,3,4,5].map(i=>addDays(mon,i));
  const W=560,H=240,L=30,R=8,T=10,B=26,max=10;
  const cw=(W-L-R)/days.length,bw=Math.min(46,cw*0.58);
  const y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours logged by category, Monday to Saturday">`;
  for(let v=0;v<=max;v+=2)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${v}</text>`;
  days.forEach((ds,i)=>{
    const st=dayStats(ds);const cx=L+cw*i+cw/2;let acc=0;
    const segs=CATS.filter(c=>st.byCat[c.id]).concat(Object.keys(st.byCat).filter(k=>!CAT[k]).map(catInfo));
    segs.forEach((c,j)=>{const n=st.byCat[c.id];const y0=y(acc),y1=y(acc+n);const top=j===segs.length-1;
      const hgt=Math.max(0,y0-y1-(top?0:2));
      s+=`<rect data-tip="${esc(DN[dow(ds)]+" · "+c.name+": "+n+" h")}" x="${cx-bw/2}" y="${y1+(top?0:2)}" width="${bw}" height="${hgt}" rx="${top?4:0}" fill="var(${c.v})"/>`;
      acc+=n;});
    if(!acc)s+=`<rect x="${cx-bw/2}" y="${y(0)-2}" width="${bw}" height="2" fill="var(--line-2)"/>`;
    else s+=`<text x="${cx}" y="${y(acc)-5}" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="var(--mono)">${acc}h</text>`;
    s+=`<rect data-tip="${esc(DN[dow(ds)]+": "+acc+" of 10 hours logged")}" x="${cx-cw/2}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent" class="hit"/>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${ds===cur?"var(--accent)":"var(--ink-2)"}" font-weight="${ds===cur?600:400}">${DN[dow(ds)]}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)"/></svg>`;
  el.innerHTML=s;
  // bars above hit areas for tooltips: move hit rects to back
  el.querySelectorAll("rect.hit").forEach(r=>r.parentNode.insertBefore(r,r.parentNode.firstChild));
  const tip=document.getElementById("tip");
  el.addEventListener("mousemove",e=>{const t=e.target.closest("[data-tip]");if(!t){tip.hidden=true;return;}tip.textContent=t.getAttribute("data-tip");tip.hidden=false;tip.style.left=(e.clientX+window.scrollX)+"px";tip.style.top=(e.clientY+window.scrollY-6)+"px";});
  el.addEventListener("mouseleave",()=>{tip.hidden=true;});
}

function rUpkeep(){
  const cfg=doc("config");const hv=doc("home").visits;
  let monthly=0;
  const cards=cfg.home.map(it=>{
    const vs=hv.filter(v=>v.item===it.id).sort((a,b)=>b.date.localeCompare(a.date));
    const last=vs[0];const next=last?addDays(last.date,it.everyDays):null;
    let pill=`<span class="pill">No visit logged</span>`;
    if(next){const dd=daysBetween(TODAY,next);pill=dd<0?`<span class="pill crit">✕ ${-dd}d overdue</span>`:dd<=3?`<span class="pill warn">⚠ due in ${dd}d</span>`:`<span class="pill good">✓ next ${fmtShort(next)}</span>`;}
    let costTxt,est;
    if(it.costBasis==="range"){costTxt=`${money(it.costMin)} – ${money(it.costMax)} per visit`;est=(it.costMin+it.costMax)/2*(365/it.everyDays/12);}
    else if(it.costBasis==="month"){costTxt=`${money(it.cost)} per month`;est=it.cost;}
    else{costTxt=`${money(it.cost)} per visit`;est=it.cost*(365/it.everyDays/12);}
    monthly+=est;
    const spent=vs.filter(v=>v.date.slice(0,4)===TODAY.slice(0,4)).reduce((s,v)=>s+(parseFloat(v.cost)||0),0);
    return `<section class="panel mcard"><div class="panel-h" style="margin:0"><h2>${esc(it.name)}</h2>${pill}</div>
      <span class="small muted">${esc(it.detail)}</span>

/* ---------- help desk analytics ---------- */
const median=a=>{a=a.filter(v=>v!=null&&!isNaN(v)).sort((x,y)=>x-y);if(!a.length)return null;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;};
const fmtMin=v=>v==null?"–":v<1?"<1 min":v<60?Math.round(v)+" min":v<1440?(v/60).toFixed(1)+" h":(v/1440).toFixed(1)+" d";
const fmtHrs=m=>m==null?"–":m<60?Math.round(m)+"m":Math.floor(m/60)+"h "+String(Math.round(m%60)).padStart(2,"0")+"m";
function activeMinutes(ts){ts=ts.slice().sort((a,b)=>a-b);if(!ts.length)return 0;let tot=0,s0=ts[0],prev=ts[0];
  for(let i=1;i<ts.length;i++){if(ts[i]-prev>30*60){tot+=(prev-s0)+600;s0=ts[i];}prev=ts[i];}tot+=(prev-s0)+600;return tot/60;}

function teamStats(dates){
  const per={};const team={handled:0,closed:0,newToday:0,first:[],reply:[],close:[],days:0,waiting:null};
  const get=id=>per[id]=per[id]||{id:String(id),convs:new Set(),handled:0,replies:0,closed:0,notes:0,assigned:null,first:[],reply:[],close:[],active:0,days:{},firstAt:null,lastAt:null,hasEvents:false};
  dates.forEach(ds=>{const sd=syncDoc(ds);const ic=sd&&sd.intercom;if(!ic)return;team.days++;
    team.handled+=ic.handled||0;team.closed+=ic.closed||0;team.newToday+=ic.newToday||0;team.waiting=ic.waiting;
    const ev=ic.events||[];const byA={};
    ev.forEach(e=>{const p=get(e.a);p.hasEvents=true;p.convs.add(ds+":"+e.c);(byA[e.a]=byA[e.a]||[]).push(e.t);
      if(e.k==="reply"){p.replies++;if(e.rt!=null){p.reply.push(e.rt/60);team.reply.push(e.rt/60);}if(e.ft!=null){p.first.push(e.ft/60);team.first.push(e.ft/60);}}
      else if(e.k==="close"){p.closed++;if(e.ct!=null){p.close.push(e.ct/60);team.close.push(e.ct/60);}}
      else if(e.k==="note")p.notes++;});
    Object.entries(byA).forEach(([a,ts])=>{const p=get(a);const m=activeMinutes(ts);p.active+=m;p.days[ds]=m;
      const mn=Math.min(...ts),mx=Math.max(...ts);if(dates.length===1){p.firstAt=mn;p.lastAt=mx;}});
    (ic.byAdmin||[]).forEach(b=>{const p=get(b.id);if(!p.hasEvents){p.handled+=b.handled||0;p.closed+=b.closed||0;if(b.medianFirstReplyMin!=null)p.first.push(b.medianFirstReplyMin);}p.assigned=b.assigned;});
    if(!ev.length&&ic.medianFirstReplyMin!=null)team.first.push(ic.medianFirstReplyMin);
  });
  const rows=Object.values(per).map(p=>({id:p.id,handled:p.hasEvents?p.convs.size:p.handled,replies:p.replies,closed:p.closed,notes:p.notes,assigned:p.assigned,
    first:median(p.first),reply:median(p.reply),close:median(p.close),active:p.hasEvents?p.active:null,days:p.days,firstAt:p.firstAt,lastAt:p.lastAt,hasEvents:p.hasEvents}));
  return{rows,team:{handled:team.handled,closed:team.closed,newToday:team.newToday,waiting:team.waiting,first:median(team.first),reply:median(team.reply),close:median(team.close),days:team.days}};
}

function shiftMonth(m,n){const [y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1);}

  if(a==="togglebug"){openBug=openBug===b.dataset.id?null:b.dataset.id;confirmBug=null;render();return;}
  if(a==="copybug"){const bg=cache["bugs/"+b.dataset.id];if(bg)copyText(devText(bg),b);return;}
  if(a==="copyopen"){const ob=openBugs();copyText(`Open bug reports (${ob.length}) as of ${fmtShort(TODAY)}\n\n`+ob.map(devText).join("\n----------\n\n"),b);return;}
  if(a==="exportbugs"){if(!downloads)return;const cols=["Ticket","Title","Type","Severity","Status","Reported","Days open","Reported by","Agents affected","Details","Workaround","Dev notes"];
    const rows=openBugs().concat(allBugs().filter(x=>isDone(x.status))).map(x=>[bugNo(x),x.title,x.type,SEVN[x.sev],x.status,(x.created||"").slice(0,10),bugAge(x),x.reporter,x.affected,x.details,x.workaround,x.devnotes].map(csvCell).join(","));
    downloads.save({filename:"bug-reports-"+TODAY+".csv",data:[cols.join(",")].concat(rows).join("\n")}).catch(()=>{});return;}
  if(a==="dlmonth"){if(!downloads)return;const F=doc("fin");const rows=(F.items||[]).map(i=>[FINC[i.cat]||i.cat,i.name,(FREQ.find(f=>f[0]===i.freq)||["",""])[1],i.amount,i.paid?"yes":"no",i.est?"estimate":""].map(csvCell).join(","));
    downloads.save({filename:"ledger-"+finMonth+".csv",data:["Category,Item,How often,Amount,Paid,Note"].concat(rows).join("\n")}).catch(()=>{});return;}
  if(a==="viewfile"){openFile=openFile===b.dataset.id?null:b.dataset.id;render();return;}
  if(a==="dlfile"){downloadFile(b.dataset.id);return;}
  if(a==="askdel"){confirmDel=b.dataset.id;render();return;}
  if(a==="delfile"){removeFile(b.dataset.id);return;}
  if(!canWrite)return;
  const d=doc("day");
  if(a==="addcall"){const now=new Date();d.calls.push({agent:val("c-agent"),type:val("c-type"),outcome:val("c-out"),impact:val("c-imp")?Number(val("c-imp")):"",note:val("c-note"),time:cur===TODAY?hLabel(now.getHours()).replace(" ",":"+pad(now.getMinutes())+" "):""});afterEdit("day",true);}
  if(a==="delcall"){d.calls.splice(i,1);afterEdit("day",true);}
  if(a==="addside"){d.side.push({type:val("s-type"),note:val("s-note")});afterEdit("day",true);}
  if(a==="delside"){d.side.splice(i,1);afterEdit("day",true);}
  if(a==="adddisp"){if(!val("d-ref")&&!val("d-amt"))return;doc("disputes").items.push({id:uid(),ref:val("d-ref"),amount:val("d-amt")?Number(val("d-amt")):"",due:val("d-due"),status:"open"});afterEdit("disputes",true);}
  if(a==="deldisp"){doc("disputes").items.splice(i,1);afterEdit("disputes",true);}
  const sh=doc("shop");
  if(a==="addshop"){const n=val("sh-name");if(!n)return;sh.items.push({id:uid(),name:n,status:"need",staple:document.getElementById("sh-staple").checked});afterEdit("shop",true);document.getElementById("sh-name")?.focus();}
  if(a==="delshop"){sh.items.splice(i,1);afterEdit("shop",true);}
  if(a==="shopst"){sh.items[i].status=b.dataset.v;afterEdit("shop",true);}
  if(a==="newweek"){const got=sh.items.filter(x=>x.status==="got").length,skip=sh.items.filter(x=>x.status==="skip").length;
    sh.history=(sh.history||[]).concat([{date:cur,got,skip}]).slice(-26);
    sh.items=sh.items.filter(x=>x.staple||x.status!=="got").map(x=>({...x,status:"need"}));
    sh.meals=(sh.meals||[]).map(m=>({...m,done:false}));afterEdit("shop",true);}
  if(a==="addmeal"){const n=val("ml-name");if(!n)return;sh.meals=(sh.meals||[]).concat([{id:uid(),name:n,done:false}]);afterEdit("shop",true);}
  if(a==="delmeal"){e.preventDefault();sh.meals.splice(i,1);afterEdit("shop",true);}
  if(a==="addvisit"){const id=b.dataset.id;const dt=val("v-date-"+id)||TODAY;const c=val("v-cost-"+id);doc("home").visits.push({id:uid(),item:id,date:dt,cost:c?Number(c):""});afterEdit("home",true);}
  if(a==="delvisit"){const h=doc("home");h.visits=h.visits.filter(v=>v.id!==b.dataset.vid);afterEdit("home",true);}
  if(a==="addbug"){const title=val("b-title");if(!title){document.getElementById("b-title")?.focus();return;}
    const id=uid();const n=allBugs().reduce((m,x)=>Math.max(m,x.n||0),0)+1;const now=new Date().toISOString();
    cache["bugs/"+id]={id,n,title,type:val("b-type"),sev:val("b-sev")||"med",reporter:val("b-who"),affected:val("b-aff")?Number(val("b-aff")):"",details:val("b-det"),workaround:"",devnotes:"",status:"Open",created:now,history:[{at:now,status:"Open"}]};
    touchPath("bugs/"+id);bugFilter="open";render();}
  if(a==="askdelbug"){confirmBug=b.dataset.id;render();}
  if(a==="delbug"){const p="bugs/"+b.dataset.id;delete cache[p];confirmBug=null;openBug=null;clearTimeout(timers[p]);delete dirty[p];
    if(db)db.doc(p).delete().catch(()=>{});else{try{localStorage.removeItem("wb:"+p);}catch(_){}}render();}
  if(a==="addfin"){const n=val("nf-name");if(!n)return;doc("fin").items.push({id:uid(),name:n,cat:val("nf-cat"),freq:val("nf-freq"),amount:val("nf-amt")?Number(val("nf-amt")):"",paid:false,start:finMonth});afterEdit("fin",true);}
  if(a==="delfin"){doc("fin").items.splice(i,1);afterEdit("fin",true);}
  if(a==="nextmonth"){const nm=shiftMonth(finMonth,1);const np="finance/"+nm;
    if(!(cache[np]&&(cache[np].items||[]).length)){
      const src=doc("fin").items;const out=[];
      src.forEach(it=>{if(it.freq==="once")return;
        if(it.freq==="quarterly"){if(monthsSince(it.start||finMonth,nm)%3!==0)return;}
        out.push({id:uid(),name:it.name,cat:it.cat,freq:it.freq,amount:it.amount,paid:false,est:it.freq==="variable",start:it.start||finMonth});});
      src.forEach(it=>{if(it.freq==="quarterly"&&monthsSince(it.start||finMonth,nm)%3!==0){}});
      cache[np]={month:nm,items:out};touchPath(np);}
    finMonth=nm;render();}
  if(a==="updbal"){const d=doc("debts").items[i];const v=val("db-bal-"+i);if(!d||v==="")return;d.balance=Number(v);d.history=(d.history||[]).concat([{date:TODAY,balance:Number(v)}]);afterEdit("debts",true);}
  if(a==="adddebt"){const n=val("nd-name");if(!n)return;const bal=Number(val("nd-bal")||0);doc("debts").items.push({id:uid(),name:n,balance:bal,payment:val("nd-pay")?Number(val("nd-pay")):"",history:[{date:TODAY,balance:bal}]});afterEdit("debts",true);}
  if(a==="askdeldebt"){confirmDebt=i;render();}
  if(a==="deldebt"){doc("debts").items.splice(i,1);confirmDebt=null;afterEdit("debts",true);}
  const cfg=doc("config");
  if(a==="delrow"){getPath(cfg,b.dataset.list).splice(i,1);afterEdit("config",true);}
  if(a==="mvrow"){const arr=getPath(cfg,b.dataset.list);const j=i+Number(b.dataset.d);if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];afterEdit("config",true);}
  if(a==="addstr"){const el=document.querySelector(`[data-addto="${b.dataset.list}"]`);const v=el&&el.value.trim();if(!v)return;getPath(cfg,b.dataset.list).push(v);afterEdit("config",true);document.querySelector(`[data-addto="${b.dataset.list}"]`)?.focus();}
  if(a==="addcat"){const n=val("nc-name");if(!n)return;cfg.lists.cats.push({id:"c"+uid(),name:n,color:val("nc-color")||"s1"});afterEdit("config",true);}
  if(a==="addfincat"){const n=val("nfc-name");if(!n)return;cfg.lists.finCats.push({id:"f"+uid(),name:n});afterEdit("config",true);}
  if(a==="addhome"){cfg.home.push({id:"h"+uid(),name:"New service",detail:"",everyDays:30,cost:0,costBasis:"visit"});afterEdit("config",true);}
  if(a==="addblock"){cfg.blocks.push({id:uid(),days:[1,2,3,4,5],start:9,end:10,label:"New block",cat:"support"});afterEdit("config",true);}
  if(a==="addtask"){cfg.tasks.push({id:uid(),label:"New task",days:[1,2,3,4,5],cat:"support",group:"Through the day"});afterEdit("config",true);}
  if(a==="addstack"){cfg.stack.push({id:uid(),label:"New item",when:"By 7 AM"});afterEdit("config",true);}
});
document.getElementById("datepick").addEventListener("change",e=>{if(e.target.value){cur=e.target.value;render();}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".rowform input[type=text],.rowform input[type=number]")&&!e.target.dataset.k){const btn=e.target.closest(".rowform").querySelector("[data-act]");if(btn){e.preventDefault();btn.click();}}});

async function uploadFile(file){
  fileErr="";if(!file)return;
  if(!/\.csv$/i.test(file.name)){fileErr="Please choose a .csv file";render();return;}
  uploading=true;render();
  try{
    const text=await file.text();const rows=parseCSV(text);
    const res=await assets.upload(new Blob([text],{type:"text/csv"}),{type:"text/csv"});
    const kind=(document.getElementById("f-kind")||{}).value||"Other";
    const wk=doc("week");wk.files=(wk.files||[]).concat([{id:res.id,name:file.name,size:res.sizeBytes,kind,rows:Math.max(0,rows.length-1),at:new Date().toISOString(),note:""}]);
    previews[res.id]={text,rows};openFile=res.id;touch("week");
  }catch(e){fileErr=(e&&e.code==="quota_exceeded")?"Storage is full":"Upload failed. Try again";}
  uploading=false;render();
}
async function downloadFile(id){
  const f=(doc("week").files||[]).find(x=>x.id===id);if(!f||!downloads)return;
  try{let t=previews[id]&&previews[id].text;if(!t){const r=await (window.__blobFetch?window.__blobFetch(id):fetch("/_blob/"+id));t=await r.text();}
    await downloads.save({filename:/\.csv$/i.test(f.name)?f.name:f.name+".csv",data:t});}catch(e){}
}
async function removeFile(id){
  const wk=doc("week");wk.files=(wk.files||[]).filter(f=>f.id!==id);confirmDel=null;if(openFile===id)openFile=null;touch("week");render();
  try{if(assets)await assets.delete(id);}catch(e){}
}
main.addEventListener("change",e=>{if(e.target.id==="f-up"&&e.target.files)uploadFile(e.target.files[0]);});
main.addEventListener("input",e=>{if(e.target.id!=="f-filter")return;const q=e.target.value.toLowerCase();let n=0;
  document.querySelectorAll("#f-table tbody tr").forEach(tr=>{const hit=!q||tr.textContent.toLowerCase().includes(q);tr.hidden=!hit;if(hit)n++;});
  const c=document.getElementById("f-count");if(c){if(!c.dataset.base)c.dataset.base=c.textContent;c.textContent=q?n.toLocaleString()+" matching":c.dataset.base;}});

/* ---------- live data ---------- */
function isEditing(){const a=document.activeElement;return a&&main.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"&&a.type!=="file";}
let queued=false,rt=null;
function scheduleRender(){clearTimeout(rt);rt=setTimeout(()=>{if(isEditing()){queued=true;return;}render();},60);}
function take(snapDoc,path){if(dirty[path])return;const v=snapDoc.data();if(v)cache[path]=JSON.parse(JSON.stringify(v));}

function loadLocal(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("wb:"))cache[k.slice(3)]=JSON.parse(localStorage.getItem(k));}}catch(e){}}

render();
(async function start(){
  try{
    const u=await (window.claude&&window.claude.use?window.claude.use("user"):null);
    if(u&&u.can){const w=await Promise.resolve(u.can("data.write"));if(w===false){canWrite=false;canWriteKnown=true;}else if(w===true)canWriteKnown=true;}
  }catch(e){}
  try{db=await (window.claude&&window.claude.use?window.claude.use("db"):null);}catch(e){db=null;}
  try{assets=await window.claude.use("assets");}catch(e){assets=null;}
  try{downloads=await window.claude.use("downloads");}catch(e){downloads=null;}
  if(!db){loadLocal();setStatus("Saving on this device only",false);render();return;}
  setStatus("Live · saved and shared",true);
  const onErr=()=>setStatus("Live updates paused. Reload to reconnect.",false);
  db.collection("days").orderBy("date","desc").limit(70).onSnapshot(s=>{s.docs.forEach(x=>take(x,"days/"+x.id));scheduleRender();},onErr);
  db.collection("weeks").orderBy("monday","desc").limit(12).onSnapshot(s=>{s.docs.forEach(x=>take(x,"weeks/"+x.id));scheduleRender();},onErr);
  db.collection("config").onSnapshot(s=>{s.docs.forEach(x=>take(x,"config/"+x.id));scheduleRender();},onErr);
  db.collection("bugs").onSnapshot(s=>{s.docChanges().forEach(ch=>{const p="bugs/"+ch.doc.id;if(ch.type==="removed"){if(!dirty[p])delete cache[p];}else take(ch.doc,p);});scheduleRender();},onErr);
  db.collection("finance").orderBy("month","desc").limit(24).onSnapshot(s=>{s.docs.forEach(x=>take(x,"finance/"+x.id));scheduleRender();},onErr);
  db.collection("sync").orderBy("date","desc").limit(60).onSnapshot(s=>{s.docs.forEach(x=>take(x,"sync/"+x.id));scheduleRender();},onErr);
  db.collection("lists").onSnapshot(s=>{s.docs.forEach(x=>take(x,"lists/"+x.id));scheduleRender();},onErr);
})();
})();
